<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة إيريني</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fbf4ea;--bg2:#f6e3dc;--ink:#3a2a2e;--rose:#ff7a7a;--rose-soft:#e8a5b0;--cloud:#f7d9b5;--card:rgba(255,250,244,.78);--line:#cfa9a3;--bird:#7b6a74;--cw:min(430px,88vw);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2226;--bg2:#3a2a30;--ink:#f6e8e2;--rose:#ff8f8f;--rose-soft:#c98793;--cloud:#6b5157;--card:rgba(58,42,48,.8);--line:#8a6870;--bird:#e7c9cf}}
:root[data-theme="dark"]{--bg1:#2b2226;--bg2:#3a2a30;--ink:#f6e8e2;--rose:#ff8f8f;--rose-soft:#c98793;--cloud:#6b5157;--card:rgba(58,42,48,.8);--line:#8a6870;--bird:#e7c9cf}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{font-family:'Amiri','Segoe UI',Tahoma,serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);overflow:hidden;position:relative}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;opacity:.92;animation:drift 30s ease-in-out infinite alternate}
.c1{width:210px;top:5%;left:2%}
.c2{width:130px;top:3%;right:28%;animation-delay:-8s}
.c3{width:230px;top:14%;right:-2%;animation-delay:-14s}
.c4{width:180px;top:46%;left:-4%;animation-delay:-4s}
.c5{width:200px;top:52%;right:-3%;animation-delay:-11s}
@keyframes drift{from{transform:translateX(-16px)}to{transform:translateX(20px)}}
.skates{position:absolute;width:84px;bottom:24%;right:6%;z-index:2;filter:drop-shadow(0 8px 6px rgba(160,70,90,.25));animation:float 6s ease-in-out infinite;transform-origin:center}
.pac2{width:56px;bottom:auto;right:auto;top:41%;left:18%;animation-delay:-3s}
.teddy{position:absolute;width:118px;bottom:6%;left:3%;z-index:2;filter:drop-shadow(0 8px 6px rgba(160,70,90,.25));animation:float 7s ease-in-out infinite;animation-delay:-1s}
@media(max-width:520px){.skates{width:64px;bottom:26%;right:3%}.pac2{width:46px;top:43%;left:20%}.teddy{width:84px;bottom:8%;left:2%}}
.balloon{position:absolute;animation:float 7s ease-in-out infinite}
.b1{width:78px;top:26%;left:7%}
.b2{width:44px;top:8%;right:7%;animation-delay:-2s}
.b3{width:36px;top:34%;right:9%;animation-delay:-4s}
@keyframes float{0%,100%{translate:0 0;rotate:-2deg}50%{translate:0 -16px;rotate:2deg}}
.bird{position:absolute;left:-70px;width:var(--w);opacity:var(--o);color:var(--bird);filter:blur(.5px);animation:fly var(--d) linear infinite;animation-delay:var(--dl)}
.bird svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(32vw,-10px)}50%{transform:translate(64vw,4px)}75%{transform:translate(96vw,-8px)}100%{transform:translate(130vw,2px)}}
.reveal{opacity:0;transition:opacity 1.6s ease,transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
body.unlocked .reveal{opacity:1}
.castle.reveal{transition:opacity 1.6s ease .5s,transform .28s cubic-bezier(.2,.8,.2,1),filter 1.8s ease}
.castle.blur{filter:blur(5px) drop-shadow(0 10px 18px rgba(160,90,100,.28))}
.dl,.dr{transition:transform 1.5s cubic-bezier(.6,.05,.3,1);transform-box:fill-box}
.dl{transform-origin:left center}.dr{transform-origin:right center}
.castle.open .dl,.castle.open .dr{transform:scaleX(.1)}
.dlight{opacity:0;transition:opacity 1.3s ease}
.castle.open .dlight{opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.balloon.reveal{transition-delay:1.1s,0s}
.skates.reveal{transition-delay:1.4s,0s}
.teddy.reveal{transition-delay:1.7s,0s}
.castle{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,88vw);z-index:1;filter:blur(0px) drop-shadow(0 10px 18px rgba(160,90,100,.28))}
.mist{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(0deg,var(--rose-soft),transparent);opacity:.55;z-index:2}

.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:3;transition:opacity .9s ease,transform .9s ease}
.screen.hide{opacity:0;transform:scale(1.04);pointer-events:none;visibility:hidden}
.gate{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:26px;padding:34px 28px;width:100%;max-width:380px;text-align:center;box-shadow:0 18px 50px rgba(190,120,120,.22)}
.gate h1{font-family:'Aref Ruqaa',serif;font-size:2rem;color:var(--rose);margin:0 0 6px}
.gate p{margin:0 0 20px;font-size:1.1rem;opacity:.85}
.gate input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:1.15rem;text-align:center;outline:none;transition:border .2s,box-shadow .2s}
.gate input:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(255,122,122,.2)}
.gate button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:14px;background:var(--rose);color:#fff;font:inherit;font-weight:700;font-size:1.15rem;cursor:pointer;transition:transform .15s,filter .2s}
.gate button:hover{filter:brightness(1.06)}
.gate button:active{transform:scale(.98)}
.err{min-height:1.5em;margin-top:10px;color:#d24a5a;font-size:1rem}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lock{font-size:2.2rem;margin-bottom:6px}

.invite{flex-direction:column;text-align:center;opacity:0;visibility:hidden;transform:translateY(20px);justify-content:flex-start;padding-top:9vh;overflow:auto}
.invite.show{opacity:1;visibility:visible;transform:none}
.quote{max-width:640px;font-size:clamp(1.05rem,3.6vw,1.45rem);line-height:2;font-weight:700;margin:0;padding:0 8px;text-shadow:0 0 10px var(--bg1),0 0 18px var(--bg1)}
.namewrap{position:absolute;left:0;right:0;bottom:calc(var(--cw)*.55);text-align:center;pointer-events:none;opacity:0}
.namewrap.on{opacity:1;transition:opacity 1.2s ease}
.nm{position:relative;display:inline-block}
.name{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:clamp(4.2rem,min(24vw,17vh),8.5rem);line-height:1.3;margin:0;padding:.1em .2em;-webkit-text-fill-color:transparent;color:transparent;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%) 200% 0/250% 100% no-repeat,linear-gradient(180deg,#ff9bb0 0%,#ff5c82 50%,#c92a56 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(1.4px 0 0 #6e2a3d) drop-shadow(-1.4px 0 0 #6e2a3d) drop-shadow(0 1.4px 0 #6e2a3d) drop-shadow(0 -1.4px 0 #6e2a3d) drop-shadow(0 0 14px rgba(255,236,240,.9)) drop-shadow(0 10px 14px rgba(110,40,60,.35))}
@keyframes shine{0%{background-position:200% 0,0 0}60%,100%{background-position:-100% 0,0 0}}
.sp{position:absolute;font-style:normal;color:#fff6d6;font-size:1.6rem;line-height:1;text-shadow:0 0 8px #ffd27a,0 0 2px #b5566f;animation:tw 2.4s ease-in-out infinite}
.s1{top:2%;right:0}.s2{top:42%;left:-2%;font-size:1.1rem;animation-delay:-.8s}.s3{bottom:8%;right:-2%;font-size:1.3rem;animation-delay:-1.5s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
.invite.show .quote{animation:rise 1.2s .3s both}
.invite.show .name{animation:shine 5s 2.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
</style>
</head>

<main class="screen" id="gate">
  <form class="gate" id="form" autocomplete="off">
    <div class="lock">🔒</div>
    <h1>دعوة خاصة</h1>
    <p>من فضلك أدخل كلمة السر لفتح الدعوة</p>
    <input id="pw" type="text" placeholder="كلمة السر" aria-label="كلمة السر" enterkeyhint="go">
    <div class="err" id="err" role="alert"></div>
    <button type="submit">فتح الدعوة</button>
  </form>
</main>

  <p class="quote">كُلُّ عَطِيَّةٍ صَالِحَةٍ وَكُلُّ مَوْهِبَةٍ تَامَّةٍ هِيَ مِنْ فَوْقُ،<br>نَازِلَةٌ مِنْ عِنْدِ أَبِي الأَنْوَارِ، الَّذِي لَيْسَ عِنْدَهُ تَغْيِيرٌ وَلَا ظِلُّ دَوَرَانٍ</p>

</section>

<script>
(function(){
  // Normalize Arabic: drop diacritics/tatweel, unify alef and yeh forms
  function norm(s){
    return s.replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/\s+/g,'').trim();

  var BODY='M52 21L46.5 19.4C44 17.5 40 17.6 36 18.6C28 20 20 22.5 8 26L9.5 27.6L22 25.5C30 25.5 38 24.5 43 22.6L46.5 21.7Z';
  function wing(f,x){return '<path d="'+UP+'"><animate attributeName="d" dur="'+f+'s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1" values="'+[UP,MID,DN,MID,UP].join(';')+'"'+(x||'')+'/></path>';}
  var wrap=document.getElementById('birds');
  [['11%',26,.38,34,-6,.9],['21%',20,.3,44,-22,1.1],['36%',32,.45,38,-14,.85],['49%',18,.28,52,-30,1.2],['58%',24,.35,41,-3,1]].forEach(function(b){
    var d=document.createElement('div');d.className='bird';
    d.style.cssText='top:'+b[0]+';--w:'+b[1]+'px;--o:'+b[2]+';--d:'+b[3]+'s;--dl:'+b[4]+'s';
    d.innerHTML='<svg viewBox="0 0 60 40" fill="currentColor"><g opacity=".55" transform="translate(4 -1)">'+wing(b[5],' begin="-'+(b[5]*.1)+'s"')+'</g><path d="'+BODY+'"/>'+wing(b[5])+'</svg>';
    wrap.appendChild(d);
  });
  var tr=[].slice.call(document.querySelectorAll('.balloon,.skates,.teddy'));
  function tilt(x,y){
    if(!document.body.classList.contains('unlocked'))return;
    tr.forEach(function(el){
      var r=el.getBoundingClientRect(),dx=(x-(r.left+r.width/2))/(r.width/2),dy=(y-(r.top+r.height/2))/(r.height/2);
      if(Math.abs(dx)<1.6&&Math.abs(dy)<1.6){
        dx=Math.max(-1,Math.min(1,dx));dy=Math.max(-1,Math.min(1,dy));
        el.style.transform='perspective(450px) rotateY('+(dx*28)+'deg) rotateX('+(-dy*28)+'deg) translate3d('+(dx*6)+'px,'+(dy*6)+'px,26px) scale(1.06)';
      }else{el.style.transform='';}
    });
  }
  function untilt(){tr.forEach(function(el){el.style.transform='';});}
  window.addEventListener('pointermove',function(e){tilt(e.clientX,e.clientY);});
  window.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')untilt();});
  document.addEventListener('mouseleave',untilt);
  var NAME='ايريني', castle=document.querySelector('.castle'), doorEl=document.getElementById('door'),
      nameEl=document.querySelector('.name'), nameWrap=document.querySelector('.namewrap'),
      cv=document.getElementById('fx'), cx=cv.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,2);
  function sizeCv(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}
  window.addEventListener('resize',sizeCv);
  function sprite(col){var c=document.createElement('canvas');c.width=c.height=48;var g=c.getContext('2d');g.translate(24,24);g.shadowColor=col;g.shadowBlur=10;g.fillStyle=col;g.beginPath();for(var i=0;i<10;i++){var r=i%2?5:12,a=i*Math.PI/5-Math.PI/2;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}g.closePath();g.fill();return c;}
  var SP=['#fff6d6','#ffd27a','#ff9bb0','#ffffff'].map(sprite);
  // sample the shape of the name so the stars can trace it
  function targets(){
    var r=nameEl.getBoundingClientRect(), fs=parseFloat(getComputedStyle(nameEl).fontSize),
        w=Math.ceil(r.width), h=Math.ceil(r.height), oc=document.createElement('canvas');
    oc.width=w;oc.height=h;var c=oc.getContext('2d');
    c.font='700 '+fs+'px "Aref Ruqaa",serif';c.textAlign='center';c.textBaseline='alphabetic';c.direction='rtl';
    var m=c.measureText(NAME), asc=m.fontBoundingBoxAscent||fs*.95, desc=m.fontBoundingBoxDescent||fs*.55;
    c.fillStyle='#000';c.fillText(NAME,w/2,fs*.1+(fs*1.3-(asc+desc))/2+asc);
    var d=c.getImageData(0,0,w,h).data, step=Math.max(4,Math.round(fs/24)), pts;
    do{pts=[];for(var y=0;y<h;y+=step)for(var x=0;x<w;x+=step)if(d[(y*w+x)*4+3]>140)pts.push({x:r.left+x+(Math.random()-.5)*step*.7,y:r.top+y+(Math.random()-.5)*step*.7});step++;}while(pts.length>850);
    return pts;
  }
  function run(){
    sizeCv();
    var pts=targets().sort(function(a,b){return b.x-a.x;}), dr=doorEl.getBoundingClientRect(),
        sx=dr.left+dr.width/2, sy=dr.top+dr.height*.55, N=pts.length, P=[], maxEnd=0;
    pts.forEach(function(t,i){
      var delay=i/N*1800+Math.random()*200, dur=1100+Math.random()*600;
      maxEnd=Math.max(maxEnd,delay+dur);
      P.push({tx:t.x,ty:t.y,delay:delay,dur:dur,mx:(sx+t.x)/2+(Math.random()-.5)*200,my:Math.min(sy,t.y)-50-Math.random()*150,s:2.6+Math.random()*3,c:Math.random()*4|0,ph:Math.random()*6.28});
    });
    var t0=performance.now(), rev=0;
    (function frame(now){
      var t=now-t0; cx.clearRect(0,0,innerWidth,innerHeight);
      if(!rev&&t>=maxEnd){rev=now;castle.classList.add('blur');nameWrap.classList.add('on');}
      var fade=rev?Math.max(0,1-(now-rev)/1300):1;
      P.forEach(function(p){
        var lt=t-p.delay; if(lt<0)return;
        var k=Math.min(lt/p.dur,1), e=1-Math.pow(1-k,3), u=1-e,
            x=u*u*sx+2*u*e*p.mx+e*e*p.tx, y=u*u*sy+2*u*e*p.my+e*e*p.ty,
            sz=p.s*3.4*(k<1?.6+.4*k:.75+.25*Math.sin(now/240+p.ph));
        cx.globalAlpha=Math.min(1,lt/150)*fade;
        cx.save();cx.translate(x,y);cx.rotate(k<1?now/280+p.ph:0);cx.drawImage(SP[p.c],-sz/2,-sz/2,sz,sz);cx.restore();
      });
      if(rev&&fade<=0){cx.clearRect(0,0,innerWidth,innerHeight);return;}
      requestAnimationFrame(frame);
    })(t0);
  }
  // door opens -> stars fly out and write the name -> castle blurs, name appears in front
  function magic(){
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){setTimeout(function(){castle.classList.add('open','blur');nameWrap.classList.add('on');},800);return;}
    setTimeout(function(){castle.classList.add('open');},2000);
    setTimeout(function(){
      var f=(document.fonts&&document.fonts.load)?document.fonts.load('700 100px "Aref Ruqaa"',NAME):Promise.resolve();
      f.catch(function(){}).then(run);
    },3000);
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(norm(pw.value)===PASS){
      err.textContent='';
      gate.classList.add('hide');document.body.classList.add('unlocked');
      setTimeout(function(){invite.classList.add('show');},450);magic();
    }else{
      err.textContent='كلمة السر غير صحيحة، حاول مرة أخرى';
      form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');
      pw.select();
    }
  });
})();
</script>
